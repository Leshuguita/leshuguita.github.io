<h2 id="title">Página no existe</h2>
<div id="text">La página pedida no existe.</div>

<script>
	function htmlToNode(html) {
		const template = document.createElement("template");
		template.innerHTML = html;
		const nNodes = template.content.childNodes.length;
		if (nNodes !== 1) {
			throw new Error(
				`html parameter must represent a single node; got ${nNodes}. ` +
					"Note that leading or trailing spaces around an element in your " +
					'HTML, like " <img/> ", get parsed as text nodes neighbouring ' +
					"the element; call .trim() on your input to avoid this.",
			);
		}
		return template.content.firstChild;
	}

	let content = document.getElementsByTagName("main")[0];

	let text = document.getElementById("text");

	let back_text = document.createElement("span");
	back_text.id = "back";
	back_text.textContent = "Volver a la página anterior";

	let back_link = document.createElement("a");
	back_link.id = "back_link";
	back_link.appendChild(
		htmlToNode(
			"<span class=\"icons_small\"> 󱞳 </span>",
		),
	);
	back_link.appendChild(back_text);

	console.log(document.referrer);
	if (document.referrer) {
		back_link.href = document.referrer;
		content.appendChild(back_link);
	}
	if (current_lang) {
		document.title = trans("title_404");
		document.getElementById("title").textContent = trans("title_404");

		back_text.textContent = trans("back_404");
	}
	if (langless_path(current_path()).startsWith("/blog")) {
		if (current_lang) {
			text.textContent = trans("blog_404");
		} else {
			text.textContent = "La entrada de blog pedida no existe, o no tiene versión en español.";
		}
	} else if (current_lang) {
		text.textContent = trans("body_404");
	}
</script>

		<script>
			let right = document.getElementsByClassName("right")[0];
			   let button = document.createElement("button");
			   button.id = "switch_theme";
			   button.addEventListener("click", toggle_colors);
			   right.prepend(button);

			   // Set either light colors, or dark colors, depending on bool
			   function set_colors(dark) {
			       if (dark) {
			           document.documentElement.classList.remove("light");
			           document.documentElement.classList.add("dark");
			       } else {
			           document.documentElement.classList.remove("dark");
			           document.documentElement.classList.add("light");
			       }
			       update_button(dark);
			       save(dark);
			   }

			   function is_currently_dark() {
			       if (document.documentElement.classList.contains("light")) {
			           return false;
			       } else if (document.documentElement.classList.contains("dark")) {
			           return true;
			       } else {
			           if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
			               return true;
			           } else {
			               return false;
			           }
			       }
			   }

			   function update_button(dark) {
			       if (dark) {
			           button.innerHTML = "";
			           
			           button.title = "Cambiar a Modo Claro";
			           
			       } else {
			           button.innerHTML = "";
			           
			           button.title = "Cambiar a Modo Oscuro";
			           
			       }
			       

			   }

			   function save(dark) {
			       let theme = "light";
			       if (dark) { theme = "dark"; }
			       document.defaultView.localStorage.setItem("theme", theme)
			   }

			   function read() {
			       let t = document.defaultView.localStorage.getItem("theme");
			       if (t) {
			           return t == "dark";
			       }
			       return null;
			   }

			   function toggle_colors() {
			       set_colors(!is_currently_dark());
			   }


			   set_colors(read() != null ? read() : is_currently_dark())
		</script>
