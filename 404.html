		<script>
			// the string avoids vscode auto format
			// should really just configure vscode properly instead
			let translations = JSON.parse(`{

            
            "en": {"learning_title":"Learning","page_name":"Leshuguita","contact":"Contact info. and stuff","date_format":"%-d %B %Y","to_top":"Back to top","rss_feed":"RSS feed","tangent":"Tangent: %s","index":"Home","tooltip_dark":"Change to Dark Mode","website_repo":"Repository for this website","tooltip_light":"Change to Light Mode","title_404":"Page not found","blog_404":"The requested blog entry doesn't exist, or doesn't have a version in english.","index_title":"¿What's here...?","about_me":"In this website I have a <a href='/en/projects'>list of stuff I've done</a>, and a <a href='/en/blog'>blog</a> where I sometimes post stuff. I also gather userful <a href='/learning'>learning resources</a>.","projects":"Projects","table_of_contents":"Contents","body_404":"The requested page does not exist.","back_404":"Back to previous page","start":"Start","lecture_videos":"Recorded lectures","cool_links_title":"Cool Sites","atom_feed":"Atom feed","no_first_indent":"true","visits":"Visit count","blog":"Blog","date_locale":"en_GB","links":"Links"}
            
            
        }`);

			let current_lang = lang();
			function lang() {
				let c = current_path().split("/")[1];
				if (c in translations) {
					return c;
				} else {
					return "";
				}
			}
			function lang_path(l, path) {
				let p = langless_path(path);
				if (l && l != "es") {
					return `/${l}${p}`;
				} else {
					return `${p}`;
				}
			}
			function langless_path(path) {
				return path.replace(new RegExp(`^\/${current_lang}\/`), "/");
			}
			function current_path() {
				return window.location.pathname;
			}
			function trans(key) {
				return translations[current_lang][key];
			}
		</script>

<h2 id="title">Página no existe</h2>
<div id="text">La página pedida no existe.</div>

<script>
	function htmlToNode(html) {
		const template = document.createElement("template");
		template.innerHTML = html;
		const nNodes = template.content.childNodes.length;
		if (nNodes !== 1) {
			throw new Error(
				`html parameter must represent a single node; got ${nNodes}. ` +
					"Note that leading or trailing spaces around an element in your " +
					'HTML, like " <img/> ", get parsed as text nodes neighbouring ' +
					"the element; call .trim() on your input to avoid this.",
			);
		}
		return template.content.firstChild;
	}

	let content = document.getElementsByTagName("main")[0];

	let text = document.getElementById("text");

	let back_text = document.createElement("span");
	back_text.id = "back";
	back_text.textContent = "Volver a la página anterior";

	let back_link = document.createElement("a");
	back_link.id = "back_link";
	back_link.appendChild(
		htmlToNode(
			"<span class=\"icons_small\"> 󱞳 </span>",
		),
	);
	back_link.appendChild(back_text);

	console.log(document.referrer);
	if (document.referrer) {
		back_link.href = document.referrer;
		content.appendChild(back_link);
	}
	if (current_lang) {
		document.title = trans("title_404");
		document.getElementById("title").textContent = trans("title_404");

		back_text.textContent = trans("back_404");
	}
	if (langless_path(current_path()).startsWith("/blog")) {
		if (current_lang) {
			text.textContent = trans("blog_404");
		} else {
			text.textContent = "La entrada de blog pedida no existe, o no tiene versión en español.";
		}
	} else if (current_lang) {
		text.textContent = trans("body_404");
	}
</script>

		<script>
			let right = document.getElementsByClassName("right")[0];
			   let button = document.createElement("button");
			   button.id = "switch_theme";
			   button.addEventListener("click", toggle_colors);
			   right.prepend(button);

			   // Set either light colors, or dark colors, depending on bool
			   function set_colors(dark) {
			       if (dark) {
			           document.documentElement.classList.remove("light");
			           document.documentElement.classList.add("dark");
			       } else {
			           document.documentElement.classList.remove("dark");
			           document.documentElement.classList.add("light");
			       }
			       update_button(dark);
			       save(dark);
			   }

			   function is_currently_dark() {
			       if (document.documentElement.classList.contains("light")) {
			           return false;
			       } else if (document.documentElement.classList.contains("dark")) {
			           return true;
			       } else {
			           if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
			               return true;
			           } else {
			               return false;
			           }
			       }
			   }

			   function update_button(dark) {
			       if (dark) {
			           button.innerHTML = "";
			           
			       } else {
			           button.innerHTML = "";
			           
			       }
			       
			       if (typeof set_theme_button_tooltip != "undefined") {
			           set_theme_button_tooltip()
			       }
			       

			   }

			   function save(dark) {
			       let theme = "light";
			       if (dark) { theme = "dark"; }
			       document.defaultView.localStorage.setItem("theme", theme)
			   }

			   function read() {
			       let t = document.defaultView.localStorage.getItem("theme");
			       if (t) {
			           return t == "dark";
			       }
			       return null;
			   }

			   function toggle_colors() {
			       set_colors(!is_currently_dark());
			   }


			   set_colors(read() != null ? read() : is_currently_dark())
		</script>
		 
		<script>
			let flags = {"en":"🇬🇧","es":"🇪🇸"};
			let tips = {"en":"Switch to English","es":"Cambiar a Español"};
			function set_lang_href(element, l) {

			    element.href = lang_path(l, current_path())
			    element.innerHTML = flags[l]
			    element.title = tips[l]
			}
			// switch lang buttons
			let langs = document.getElementsByClassName("switch_lang")
			for (let i = 0; i < langs.length; i++) {
			    let elem = langs.item(i);
			    let lang = Object.keys(translations)[i]
			    if (lang == current_lang) {
			        set_lang_href(elem, "es");
			    } else {
			        set_lang_href(elem, lang);
			    }
			}
			// switch tab names and paths

			if (current_lang) {
			    let tabs = document.getElementsByClassName("tab");
			    for (let i = 0; i < tabs.length; i++) {
			        let elem = tabs.item(i);
			        elem.textContent = trans(elem.getAttribute("t_key"))
			        let u = new URL(elem.href)
			        elem.href = lang_path(current_lang, u.pathname)
			    }
			}
			// switch theme button
			function set_theme_button_tooltip() {
			    if (current_lang) {
			        let switch_theme = document.getElementById("switch_theme");
			        if (is_currently_dark()) {
			            switch_theme.title = trans("tooltip_light");
			        } else {
			            switch_theme.title = trans("tooltip_dark");
			        }
			    }
			}
			set_theme_button_tooltip()
		</script>
